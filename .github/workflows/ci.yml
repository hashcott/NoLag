name: ci

on:
  push:
    branches: [main]
    # A version tag builds everything, runs the installer end to end, and
    # publishes a GitHub release.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows as well as Linux: the client was written on macOS and none of it
    # had run on the platform it ships for.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: go vet (windows build of the client, from Linux)
        if: runner.os == 'Linux'
        run: GOOS=windows go vet ./...
      - run: go test -count=1 ./...

  store:
    # The control plane's store tests skip without a database, so the test job
    # never ran them. This one gives them one.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gnl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gnl"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: store tests against Postgres
        # Explicit bash runs with pipefail, so a failing go test is not hidden by tee.
        shell: bash
        run: |
          test_dsn='postgres://postgres:test@127.0.0.1:5432/gnl?sslmode=disable'
          GNL_TEST_DSN="$test_dsn" go test -count=1 -v ./internal/control/ | tee store.log
          ! grep -q -- '--- SKIP' store.log

  firewall:
    # iptables and ipset against a real kernel, in a privileged container so the
    # runner's own firewall is left alone. The same script developers run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy/verify-firewall-in-docker.sh

  build:
    needs: [test, store, firewall]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: relay and control plane (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/linux
          for c in gnl-agent gnl-control gnl-probe gnl-analyze gnl-profile gnl-relaycheck; do
            go build -trimpath -o dist/linux/$c ./cmd/$c
          done
          # The relay installer expects gnl-agent beside it.
          cp deploy/relay-v1.sh dist/linux/
      - name: Windows client (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/windows
          go build -trimpath -o dist/windows/gnl-service.exe ./cmd/gnl-service
          # -H=windowsgui on the interface only; without it a console window opens
          # behind the tray icon and stays there.
          go build -trimpath -ldflags -H=windowsgui -o dist/windows/gnl-ui.exe ./cmd/gnl-ui
          # The manifest has to travel with gnl-ui.exe, and install.ps1 expects
          # all of them side by side.
          cp deploy/windows/gnl-ui.exe.manifest deploy/windows/install.ps1 deploy/windows/uninstall.ps1 dist/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: gamenolag-linux-amd64
          path: dist/linux/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gamenolag-windows-amd64
          path: dist/windows/
          if-no-files-found: error

  installer:
    # Builds GameNoLag-Setup.exe, then installs it for real on a Windows runner,
    # talks to the service over its pipe, and uninstalls it. Nothing else in CI
    # runs the client as a Windows service.
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gamenolag-windows-amd64
          path: payload
      - name: version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: build the installer
        shell: pwsh
        env:
          # Optional repository variable; empty leaves the field for the player.
          DEFAULT_CONTROL_URL: ${{ vars.GNL_CONTROL_URL }}
        run: |
          Copy-Item LICENSE payload\
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /Q "/DAppVersion=${{ steps.version.outputs.value }}" "/DPayloadDir=$PWD\payload" `
               "/DDefaultControlUrl=$env:DEFAULT_CONTROL_URL" "/O$PWD\dist" deploy\windows\gamenolag.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-ChildItem dist
      - name: install, use and uninstall it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist\GameNoLag-Setup-*.exe).FullName
          $common = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'

          # Every wait is bounded and says what it was waiting for. A setup that
          # blocks on a dialog nobody can see would otherwise hold the runner for
          # hours and report nothing.
          function Run-Bounded($file, $arguments, $what, $seconds = 300) {
            Write-Host "==> $what"
            $p = Start-Process $file -ArgumentList $arguments -PassThru
            if (-not $p.WaitForExit($seconds * 1000)) {
              Get-Process | Where-Object { $_.ProcessName -match 'setup|unins|_iu|powershell|pwsh|gnl' } |
                Format-Table Id, ProcessName, StartTime -AutoSize | Out-String | Write-Host
              throw "$what did not finish within $seconds s"
            }
            return $p.ExitCode
          }

          # A key that is not a key, and a plain-http address, are refused before
          # anything is written.
          $code = Run-Bounded $setup ($common + '/KEY=not;a-key', '/URL=https://example.invalid', '/LOG=bad-key.log') 'setup with an invalid key'
          if ($code -eq 0) { throw "setup accepted an invalid key" }
          if (Get-Service GameNoLag -ErrorAction SilentlyContinue) { throw "installed with an invalid key" }
          $code = Run-Bounded $setup ($common + '/KEY=GNL-TEST-TEST-TEST-TEST', '/URL=http://example.invalid', '/LOG=bad-url.log') 'setup with a plain-http address'
          if ($code -eq 0) { throw "setup accepted a plain-http control URL" }

          $code = Run-Bounded $setup ($common + '/KEY=GNL-TEST-TEST-TEST-TEST', '/URL=https://example.invalid', '/LOG=setup.log') 'setup'
          if ($code -ne 0) { throw "setup exited $code" }

          $svc = Get-Service GameNoLag
          if ($svc.Status -ne 'Running') { throw "service is $($svc.Status)" }
          foreach ($f in 'gnl-service.exe', 'gnl-ui.exe', 'gnl-ui.exe.manifest', 'uninstall.ps1') {
            if (-not (Test-Path "$env:ProgramFiles\GameNoLag\$f")) { throw "missing $f" }
          }
          $cfg = Get-Content "$env:ProgramData\GameNoLag\config.json" -Raw | ConvertFrom-Json
          if ($cfg.contributor_key -ne 'GNL-TEST-TEST-TEST-TEST') { throw "config.json not written" }
          # The data directory holds the private key: only SYSTEM and Administrators.
          $readers = (Get-Acl "$env:ProgramData\GameNoLag").Access |
            Where-Object { $_.IdentityReference -notmatch 'SYSTEM|Administrators' }
          if ($readers) { throw "data directory readable by: $($readers.IdentityReference -join ', ')" }

          # The pipe answers status, and refuses anything outside the four verbs.
          function Ask($line) {
            Write-Host "==> pipe: $line"
            $pipe = New-Object System.IO.Pipes.NamedPipeClientStream('.', 'GameNoLag', [System.IO.Pipes.PipeDirection]::InOut)
            $pipe.Connect(15000)
            $w = New-Object System.IO.StreamWriter($pipe); $w.AutoFlush = $true
            $r = New-Object System.IO.StreamReader($pipe)
            $w.Write("$line`n")
            $read = $r.ReadLineAsync()
            if (-not $read.Wait(30000)) { $pipe.Dispose(); throw "no answer on the pipe to $line" }
            $pipe.Dispose()
            return $read.Result | ConvertFrom-Json
          }
          $status = Ask '{"verb":"status"}'
          if ($status.state -ne 'disconnected') { throw "status replied $($status | ConvertTo-Json -Compress)" }
          $refused = Ask '{"verb":"shutdown"}'
          if ($refused.ok) { throw "the pipe accepted an unknown verb" }

          # Uninstall. The uninstaller hands over to a copy of itself, so wait for
          # the effect rather than the process.
          $null = Run-Bounded "$env:ProgramFiles\GameNoLag\unins000.exe" ($common + '/LOG=uninstall.log') 'uninstall'
          for ($i = 0; $i -lt 60 -and (Get-Service GameNoLag -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          if (Get-Service GameNoLag -ErrorAction SilentlyContinue) { throw "service survived uninstall" }
          if (Test-Path "$env:ProgramFiles\GameNoLag\gnl-service.exe") { throw "binary survived uninstall" }
          if (-not (Test-Path "$env:ProgramData\GameNoLag\device.key")) { throw "uninstall removed the device identity" }
          Write-Host "installer: refused bad input, installed, answered on the pipe, uninstalled cleanly"
      - name: what the machine looked like
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in 'bad-key.log', 'bad-url.log', 'setup.log', 'uninstall.log', "$env:ProgramData\GameNoLag\service.log") {
            if (Test-Path $f) { Write-Host "===== $f"; Get-Content $f -Tail 80 }
          }
          Get-Service GameNoLag -ErrorAction SilentlyContinue | Format-List * | Out-String | Write-Host
      - uses: actions/upload-artifact@v4
        with:
          name: gamenolag-setup
          path: dist/GameNoLag-Setup-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: assemble
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME}"
          mkdir release
          cp artifacts/gamenolag-setup/GameNoLag-Setup-*.exe release/
          (cd artifacts/gamenolag-windows-amd64 && zip -q -r "../../release/gamenolag-windows-amd64-$v.zip" .)
          chmod +x artifacts/gamenolag-linux-amd64/*
          tar -C artifacts/gamenolag-linux-amd64 -czf "release/gamenolag-linux-amd64-$v.tar.gz" .
          # Loose, with their own checksums, because the relay guide has a
          # contributor fetch exactly these two and check them.
          cp artifacts/gamenolag-linux-amd64/relay-v1.sh artifacts/gamenolag-linux-amd64/gnl-agent release/
          (cd release && for f in relay-v1.sh gnl-agent; do sha256sum "$f" > "$f.sha256"; done)
          (cd release && sha256sum * > SHA256SUMS)
          ls -l release
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --title "GameNoLag $GITHUB_REF_NAME" \
            --generate-notes --verify-tag

